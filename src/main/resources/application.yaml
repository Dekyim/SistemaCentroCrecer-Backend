server:
  port: 8081
  servlet:
    context-path: /sistemacentrocrecer

spring:
  application:
    name: SistemaCentroCrecer
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${BD_URL}
    username: ${BD_USER}
    password: ${BD_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        order_updates: true
        order_inserts: true
    show-sql: false
logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  default-admin:
    email: ${DEFAULT_ADMIN_EMAIL}
    password: ${DEFAULT_ADMIN_PASSWORD}
